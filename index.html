<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProgNozer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}

html,body{
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:#1a2a45
}

button{border:0;cursor:pointer;font-family:inherit}
button:active{transform:scale(.97)}

/* ================= AUTH SCREEN ================= */

.auth-screen{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(ellipse at 30% 0%,#ffffff 0%,#cde5ff 30%,#a8cdf0 60%,#c5ddf7 100%);
  overflow:hidden
}

/* soft blob decorations */
.auth-screen::before,
.auth-screen::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none
}
.auth-screen::before{
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(255,255,255,.7) 0%,rgba(180,218,255,.4) 50%,transparent 70%);
  top:-180px;left:-120px
}
.auth-screen::after{
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(160,205,245,.5) 0%,transparent 65%);
  bottom:-120px;right:-80px
}

.auth-box{
  width:min(380px,100%);
  padding:36px 28px 30px;
  border-radius:32px;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1.5px solid rgba(255,255,255,0.9);
  box-shadow:0 24px 80px rgba(60,110,180,.16),0 2px 10px rgba(255,255,255,.8) inset;
  text-align:center;
  position:relative;
  z-index:1
}

.auth-app-icon{
  width:76px;
  height:76px;
  border-radius:20px;
  background:linear-gradient(145deg,#5ab5ff,#1a7de8);
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 28px rgba(26,125,232,.38)
}

.auth-app-icon svg{
  width:42px;height:42px;fill:#fff
}

.auth-logo{
  font-size:34px;
  font-weight:900;
  letter-spacing:-1.2px;
  background:linear-gradient(135deg,#1a2a4a 40%,#2a7fff 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:16px
}

.auth-box h2{
  font-size:26px;
  font-weight:900;
  color:#1a2a45;
  margin-bottom:8px
}

.auth-box p{
  color:#6a85a8;
  line-height:1.55;
  font-size:15px
}

.auth-buttons{
  margin-top:28px
}

.auth-google{
  width:100%;
  background:#fff;
  color:#1a2a45;
  padding:15px 20px;
  border-radius:50px;
  font-weight:800;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  box-shadow:0 4px 18px rgba(0,0,0,.11);
  border:1.5px solid rgba(210,225,245,.9);
  transition:.15s
}

.auth-google:hover{
  box-shadow:0 6px 24px rgba(0,0,0,.16)
}

.auth-status{
  min-height:18px;
  margin-top:16px;
  color:#7a95b8;
  font-size:13px
}

.auth-terms{
  margin-top:14px;
  font-size:12px;
  color:#8aa4c2;
  line-height:1.6
}

.auth-terms a{
  color:#2a7fff;
  text-decoration:underline
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-box">

    <div class="auth-app-icon">
      <!-- car icon -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 28l5-14h34l5 14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="6" y="28" width="52" height="18" rx="6" fill="#fff" opacity=".95"/>
        <circle cx="18" cy="46" r="6" fill="#1a7de8"/>
        <circle cx="18" cy="46" r="3" fill="#fff"/>
        <circle cx="46" cy="46" r="6" fill="#1a7de8"/>
        <circle cx="46" cy="46" r="3" fill="#fff"/>
        <rect x="12" y="32" width="12" height="8" rx="2" fill="#5ab5ff"/>
        <rect x="40" y="32" width="12" height="8" rx="2" fill="#5ab5ff"/>
        <rect x="26" y="32" width="12" height="8" rx="2" fill="#5ab5ff"/>
      </svg>
    </div>

    <div class="auth-logo">ProgNozer</div>

    <h2>Добро пожаловать 👋</h2>
    <p>Для доступа к ProgNozer Community<br>необходимо войти через Google.</p>

    <div class="auth-buttons">
      <button class="auth-google" id="authGoogleBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Продолжить с Google
      </button>
    </div>

    <div class="auth-status" id="authStatus"></div>

    <div class="auth-terms">
      Продолжая, вы соглашаетесь с
      <a href="#">Условиями использования</a><br>
      и <a href="#">политикой конфиденциальности</a>.
    </div>

  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script>
const FIREBASE_CONFIG={
  apiKey:"AIzaSyAhKt3V04BH3PkSC4_mAdcJPghOstOd-7A",
  authDomain:"drivezone-ae945.firebaseapp.com",
  databaseURL:"https://drivezone-ae945-default-rtdb.firebaseio.com",
  projectId:"drivezone-ae945",
  storageBucket:"drivezone-ae945.firebasestorage.app",
  messagingSenderId:"917903784504",
  appId:"1:917903784504:web:5ed7d142892b1d7ca004cd"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();

function setStatus(msg){ document.getElementById("authStatus").textContent = msg; }

async function continueGoogle(){
  setStatus("⏳ Открываем Google…");
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    const result = await auth.signInWithPopup(provider);
    if(result && result.user){
      setStatus("✅ Вход выполнен: " + result.user.displayName);
    }
  }catch(e){
    setStatus("❌ " + (e.message || "Ошибка входа"));
  }
}

auth.onAuthStateChanged(user => {
  if(user && !user.isAnonymous){
    setStatus("✅ Вы вошли как " + user.displayName);
    // здесь можно перенаправить пользователя на основное приложение
  } else {
    setStatus("");
  }
});

document.getElementById("authGoogleBtn").onclick = continueGoogle;
</script>
</body>
</html>

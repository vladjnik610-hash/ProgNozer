<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ProgNozer</title>
  <style>
    /* ===== Все стили из оригинального проекта ===== */
    :root{
      --bg:#050b15;
      --bg2:#071426;
      --card:#0c1727;
      --card2:#0f2036;
      --line:#1c426d;
      --blue:#268cff;
      --blue2:#5ab3ff;
      --text:#f4f8ff;
      --muted:#8295ad;
      --green:#42ff9a;
      --red:#ff5d68;
      --shadow:0 12px 35px rgba(0,0,0,.28)
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent
    }

    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(circle at 50% -10%,#123d6d 0,#06111f 38%,#030811 80%);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif
    }

    body{
      overflow-x:hidden
    }

    .app{
      max-width:760px;
      margin:auto;
      min-height:100vh;
      padding-bottom:92px
    }

    /* ================= HEADER ================= */
    .top{
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 18px;
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(4,9,17,.94);
      backdrop-filter:blur(14px);
      border-bottom:1px solid #173250
    }

    .logo{
      font-size:30px;
      font-weight:900;
      font-style:italic;
      letter-spacing:-1.5px;
      color:#4ca7ff
    }

    /* ================= MAIN ================= */
    main{
      padding:18px
    }

    .hero{
      border:1px solid #28649d;
      border-radius:30px;
      padding:29px 18px;
      text-align:center;
      background:
        radial-gradient(circle at 50% 0,#164777,#0a1728 68%);
      box-shadow:var(--shadow);
      margin-bottom:20px
    }

    .hero .small{
      font-size:18px;
      color:#879bb2
    }

    .hero h1{
      font-size:40px;
      margin:9px 0
    }

    .hero p{
      margin:0;
      color:#8da0b8;
      font-size:18px
    }

    /* небольшая анимация для пульсирующей точки */
    .pulse-dot{
      display:inline-block;
      width:12px;
      height:12px;
      background:#42ff9a;
      border-radius:50%;
      margin-right:8px;
      animation:pulse 1.5s infinite;
      vertical-align:middle
    }

    @keyframes pulse{
      0%{opacity:1;transform:scale(1)}
      50%{opacity:0.3;transform:scale(0.8)}
      100%{opacity:1;transform:scale(1)}
    }

    /* адаптив */
    @media(max-width:520px){
      main{
        padding:14px 15px
      }
      .hero h1{
        font-size:30px
      }
      .hero p{
        font-size:16px
      }
    }
  </style>
</head>
<body>

<div class="app">

  <header class="top">
    <div class="logo">ProgNozer</div>
  </header>

  <main>
    <div class="hero">
      <div class="small">
        <span class="pulse-dot"></span> Внимание
      </div>
      <h1>Сайт временно не доступен</h1>
      <p>Введутся тех работы. Ожидайте.</p>
      <p style="margin-top:12px; font-size:14px; color:var(--muted);">
        Мы скоро вернёмся
      </p>
    </div>
  </main>

</div>

</body>
</html>
